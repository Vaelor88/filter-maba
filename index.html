<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Filter Perkenalan MABA</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0a0a0f;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;overscroll-behavior:none}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;background:#000}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  video{opacity:0;pointer-events:none}
  canvas{z-index:2}

  /* ---------- layar mulai ---------- */
  #mulai{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:20px;padding:28px;text-align:center;
    background:radial-gradient(circle at 50% 35%,#16213a 0%,#0a0a0f 70%)}
  #mulai h1{font-size:clamp(21px,6.2vw,30px);font-weight:800;letter-spacing:.5px;line-height:1.25}
  #mulai h1 span{color:#28e0ff}
  #mulai p{font-size:clamp(12.5px,3.4vw,15px);opacity:.72;line-height:1.65;max-width:330px}
  .tombol{background:linear-gradient(135deg,#28e0ff,#0a84ff);color:#00131c;border:none;
    padding:16px 40px;border-radius:100px;font-size:16.5px;font-weight:800;
    letter-spacing:.4px;box-shadow:0 8px 30px rgba(40,224,255,.36);cursor:pointer}
  .tombol:active{transform:scale(.96)}
  .tombol.lain{background:transparent;color:#28e0ff;border:1.5px solid rgba(40,224,255,.5);
    box-shadow:none;padding:12px 26px;font-size:14px}
  .tombol.tab{background:linear-gradient(135deg,#ffd23f,#ff9500);color:#241a00;
    box-shadow:0 8px 30px rgba(255,180,40,.34)}
  #diag{font-size:11.5px;line-height:1.7;opacity:.68;max-width:330px}
  #diag b{color:#28e0ff}
  #diag .buruk{color:#ffb35a}
  #galat{color:#ff8080;font-size:13px;max-width:320px;line-height:1.6;display:none;
    background:rgba(255,60,60,.1);border:1px solid rgba(255,80,80,.3);
    padding:12px 16px;border-radius:12px}

  /* ---------- memuat ---------- */
  #memuat{position:absolute;inset:0;z-index:25;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;background:#0a0a0f}
  .putar{width:44px;height:44px;border:3px solid rgba(40,224,255,.2);
    border-top-color:#28e0ff;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #memuat p{font-size:13.5px;opacity:.75}

  /* ---------- kontrol bawah ---------- */
  #kontrol{position:absolute;left:0;right:0;bottom:0;z-index:20;display:none;
    padding:12px 12px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(0,0,0,.82),transparent)}
  .baris{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
  .pil{background:rgba(255,255,255,.11);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);
    color:#fff;padding:9px 15px;border-radius:100px;font-size:12.5px;font-weight:600;cursor:pointer}
  .pil:active{background:rgba(255,255,255,.24)}
  .pil.aktif{background:#28e0ff;color:#00131c;border-color:#28e0ff}
  .pil.rekam{background:#ff3b30;border-color:#ff3b30;color:#fff}

  /* ---------- status atas ---------- */
  #status{position:absolute;top:0;left:0;right:0;z-index:20;display:none;
    padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
    background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent);
    display:none;justify-content:space-between;align-items:center;
    font-size:11px;font-variant-numeric:tabular-nums}
  #fps{opacity:.8}
  #babakNama{color:#28e0ff;font-weight:700;letter-spacing:1px}

  /* ---------- panel pengaturan ---------- */
  #atur{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;
    background:rgba(6,8,14,.97);padding:20px;overflow-y:auto;
    padding-top:calc(20px + env(safe-area-inset-top))}
  #atur h2{font-size:17px;margin-bottom:14px;color:#28e0ff}
  .kolom{margin-bottom:13px}
  .kolom label{display:block;font-size:11.5px;opacity:.62;margin-bottom:5px;
    text-transform:uppercase;letter-spacing:.6px}
  .kolom input{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
    color:#fff;padding:11px 13px;border-radius:10px;font-size:15px;font-family:inherit}
  .kolom input:focus{outline:none;border-color:#28e0ff}
  .warna{display:flex;gap:9px;flex-wrap:wrap}
  .wbulat{width:36px;height:36px;border-radius:50%;border:2.5px solid transparent;cursor:pointer}
  .wbulat.pilih{border-color:#fff;transform:scale(1.12)}
  #tutupAtur{margin-top:8px;margin-bottom:20px}
</style>
</head>
<body>
<div id="app"><div id="stage">
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="kanvas"></canvas>

  <div id="mulai">
    <h1>Filter Perkenalan <span>MABA</span></h1>
    <p>Pakai kamera HP kamu yang jernih.<br>Tidak perlu install apa pun.</p>
    <button class="tombol" id="btnMulai">Nyalakan Kamera</button>
    <button class="tombol tab" id="btnTab" style="display:none">Buka di Tab Baru ↗</button>
    <button class="tombol lain" id="btnAtur">Ubah Data Diri</button>
    <div id="diag"></div>
    <div id="galat"></div>
  </div>

  <div id="memuat"><div class="putar"></div><p id="memuatTeks">Memuat model AI…</p></div>

  <div id="status">
    <span id="fps">-- fps</span>
    <span id="babakNama">HUD</span>
    <span id="tanda">●</span>
  </div>

  <div id="kontrol">
    <div class="baris" style="margin-bottom:8px">
      <button class="pil" data-babak="0">1 · Scan</button>
      <button class="pil" data-babak="1">2 · Portal</button>
      <button class="pil" data-babak="2">3 · Pop-art</button>
    </div>
    <div class="baris">
      <button class="pil" id="btnFilter">Filter ▸</button>
      <button class="pil" id="btnKamera">Balik</button>

  <div id="atur">
    <h2>Data Diri</h2>
    <div class="kolom"><label>Nama</label><input id="iNama" maxlength="26"></div>
    <div class="kolom"><label>Prodi</label><input id="iProdi" maxlength="34"></div>
    <div class="kolom"><label>Angkatan</label><input id="iAngkatan" maxlength="9"></div>
    <div class="kolom"><label>Kampus</label><input id="iKampus" maxlength="42"></div>
    <div class="kolom"><label>Tiga kata (pisahkan koma)</label><input id="iKata" maxlength="46"></div>
    <div class="kolom"><label>Penutup</label><input id="iPenutup" maxlength="22"></div>
    <div class="kolom"><label>Warna tema</label>
      <div class="warna" id="pilihWarna"></div>
    </div>
    <button class="tombol" id="tutupAtur">Simpan</button>
  </div>
</div></div>

<script type="module">
// =====================================================================
//  Filter Perkenalan MABA - versi web (realtime di HP)
//  Portal tangan + HUD scanner + Pop-art, memakai MediaPipe Tasks Vision.
// =====================================================================
import { FilesetResolver, HandLandmarker, FaceDetector }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs";

// ------------------------------------------------------------- elemen
const vid    = document.getElementById("vid");
const kanvas = document.getElementById("kanvas");
const ctx    = kanvas.getContext("2d", { willReadFrequently: true });
const elMulai = document.getElementById("mulai");
const elMuat  = document.getElementById("memuat");
const elMuatT = document.getElementById("memuatTeks");
const elKtrl  = document.getElementById("kontrol");
const elStat  = document.getElementById("status");
const elFps   = document.getElementById("fps");
const elBabak = document.getElementById("babakNama");
const elGalat = document.getElementById("galat");
const elAtur  = document.getElementById("atur");

// ------------------------------------------------------------- data
const TEMA = {
  cyan:    { utama:"#28e0ff", aksen:"#0a84ff", terang:"#dcfbff" },
  magenta: { utama:"#ff4fd8", aksen:"#c850ff", terang:"#ffe0fa" },
  hijau:   { utama:"#5aff8f", aksen:"#12c878", terang:"#dcffe8" },
  oranye:  { utama:"#ff9632", aksen:"#ffc81e", terang:"#fff0dc" },
  ungu:    { utama:"#8c6bff", aksen:"#ff5a8c", terang:"#ece6ff" },
};

const bawaan = {
  nama:"MISHU ADITYA", prodi:"Teknik Informatika", angkatan:"2026",
  kampus:"Universitas Lambung Mangkurat",
  kata:["NGODING","NGOPI","RANDOM"], penutup:"SALAM KENAL", tema:"cyan",
};
let D = { ...bawaan };
try {
  const t = localStorage.getItem("filterMaba");
  if (t) D = { ...bawaan, ...JSON.parse(t) };
} catch (e) {}
const simpan = () => {
  try { localStorage.setItem("filterMaba", JSON.stringify(D)); } catch (e) {}
};
const W = () => TEMA[D.tema] || TEMA.cyan;

// ------------------------------------------------------------- state
let handLm = null, faceDet = null;
let jalan = false, babak = 0, tMulai = 0;
let depan = true, idxFilter = 0, siapGanti = true, kilat = 0;
let quadHalus = null, wajahBox = null, portalVis = 0;
let fpsHal = 0, tLalu = 0, tDeteksiLalu = 0, tanganTerakhir = [];
let msDeteksi = 0;          // rata-rata waktu deteksi (ms)
let jedaDeteksi = 45;       // jeda antar deteksi, menyesuaikan sendiri
let mutuFilter = 190;       // sisi maksimum kanvas filter, menyesuaikan sendiri
let rec = null, potongan = [], sedangRekam = false;
const DUR = [9, 13, 8];

// kanvas bantu untuk filter di dalam portal
const kBantu = document.createElement("canvas");
const cBantu = kBantu.getContext("2d", { willReadFrequently: true });

// =====================================================================
//  Filter (dijalankan pada potongan gambar portal)
// =====================================================================
const FILTER = [
  ["KONTUR",   fKontur],
  ["HALFTONE", fHalftone],
  ["DUOTONE",  fDuotone],
  ["TERMAL",   fTermal],
  ["GLITCH",   fGlitch],
  ["BLOK",     fBlok],
  ["POSTER",   fPoster],
  ["KACA",     fKaca],
];

function hexRgb(h) {
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}

function fKontur(d, w, h) {
  const a = d.data, g = new Uint8ClampedArray(w*h);
  for (let i=0,p=0;i<a.length;i+=4,p++) g[p] = (a[i]*0.299+a[i+1]*0.587+a[i+2]*0.114)|0;
  const [R,G,B] = hexRgb(W().utama);
  for (let y=0;y<h;y++) for (let x=0;x<w;x++) {
    const p = y*w+x, i = p*4;
    let tepi = 0;
    if (x>0 && y>0 && x<w-1 && y<h-1) {
      const gx = -g[p-w-1]-2*g[p-1]-g[p+w-1]+g[p-w+1]+2*g[p+1]+g[p+w+1];
      const gy = -g[p-w-1]-2*g[p-w]-g[p-w+1]+g[p+w-1]+2*g[p+w]+g[p+w+1];
      tepi = Math.sqrt(gx*gx+gy*gy);
    }
    if (tepi > 68) { a[i]=R; a[i+1]=G; a[i+2]=B; }
    else { a[i]*=0.15; a[i+1]*=0.15; a[i+2]*=0.17; }
  }
  return d;
}

function fHalftone(d, w, h) {
  const a = d.data, sel = 6;
  const out = new Uint8ClampedArray(a.length);
  for (let y=0;y<h;y++) for (let x=0;x<w;x++) {
    const i = (y*w+x)*4;
    const g = (a[i]*0.299+a[i+1]*0.587+a[i+2]*0.114)/255;
    const cx = (x%sel)-sel/2, cy = (y%sel)-sel/2;
    const jarak = Math.sqrt(cx*cx+cy*cy);
    const r = (1-g)*(sel/1.35);
    const gelap = jarak < r;
    out[i]=gelap?18:243; out[i+1]=gelap?18:243; out[i+2]=gelap?22:245; out[i+3]=255;
  }
  d.data.set(out); return d;
}

function fDuotone(d) {
  const a = d.data;
  for (let i=0;i<a.length;i+=4) {
    const g = (a[i]*0.299+a[i+1]*0.587+a[i+2]*0.114)/255;
    a[i]   = 22 + g*233;
    a[i+1] = 10 + g*212;
    a[i+2] = 34 + g*186;
  }
  return d;
}

function fTermal(d) {
  const a = d.data;
  for (let i=0;i<a.length;i+=4) {
    const g = (a[i]*0.299+a[i+1]*0.587+a[i+2]*0.114)/255;
    a[i]   = Math.min(255, g<.5 ? g*120 : 60+(g-.5)*390);
    a[i+1] = Math.min(255, g<.4 ? g*70  : (g-.4)*380);
    a[i+2] = Math.min(255, g<.35? 90+g*300 : Math.max(0,190-(g-.35)*260));
  }
  return d;
}

function fGlitch(d, w, h) {
  const a = d.data, s = 6, asli = new Uint8ClampedArray(a);
  for (let y=0;y<h;y++) for (let x=0;x<w;x++) {
    const i = (y*w+x)*4;
    const xr = Math.min(w-1, x+s), xb = Math.max(0, x-s);
    a[i]   = asli[(y*w+xr)*4];
    a[i+2] = asli[(y*w+xb)*4+2];
    if (y%3===0) { a[i]*=0.7; a[i+1]*=0.7; a[i+2]*=0.7; }
  }
  return d;
}

function fBlok(d, w, h) {
  const a = d.data, s = 9;
  for (let by=0;by<h;by+=s) for (let bx=0;bx<w;bx+=s) {
    let r=0,g=0,b=0,n=0;
    for (let y=by;y<Math.min(by+s,h);y++) for (let x=bx;x<Math.min(bx+s,w);x++) {
      const i=(y*w+x)*4; r+=a[i]; g+=a[i+1]; b+=a[i+2]; n++;
    }
    r/=n; g/=n; b/=n;
    for (let y=by;y<Math.min(by+s,h);y++) for (let x=bx;x<Math.min(bx+s,w);x++) {
      const i=(y*w+x)*4, grs = (y===by||x===bx)?0.5:1;
      a[i]=r*grs; a[i+1]=g*grs; a[i+2]=b*grs;
    }
  }
  return d;
}

function fPoster(d) {
  const a = d.data, n = 4, langkah = 255/(n-1);
  for (let i=0;i<a.length;i+=4) {
    a[i]   = Math.round(a[i]/langkah)*langkah;
    a[i+1] = Math.round(a[i+1]/langkah)*langkah;
    a[i+2] = Math.round(a[i+2]/langkah)*langkah;
  }
  return d;
}

function fKaca(d) {
  const a = d.data;
  for (let i=0;i<a.length;i+=4) {
    a[i]   = a[i]*0.58 + 255*0.42;
    a[i+1] = a[i+1]*0.58 + 255*0.42;
    a[i+2] = a[i+2]*0.58 + 255*0.42;
  }
  return d;
}

// =====================================================================
//  Bantuan gambar
// =====================================================================
const easeOut = t => 1-Math.pow(1-Math.min(1,Math.max(0,t)),3);
function amplop(t, masuk=.18, keluar=.82) {
  if (t<masuk) return easeOut(t/masuk);
  if (t>keluar) return easeOut((1-t)/(1-keluar));
  return 1;
}
const ketik = (s,t,mulai,dur) =>
  t<mulai ? "" : s.slice(0, Math.round(s.length*Math.min(1,(t-mulai)/dur)));

function muatFont(txt, dasar, maks, tebal="800") {
  let u = dasar;
  ctx.font = `${tebal} ${u}px -apple-system,"Segoe UI",Roboto,sans-serif`;
  while (ctx.measureText(txt).width > maks && u > 10) {
    u -= 1;
    ctx.font = `${tebal} ${u}px -apple-system,"Segoe UI",Roboto,sans-serif`;
  }
  return u;
}

function kotakBulat(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);     ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function panelKaca(x,y,w,h,alpha=.5,r=16,tepi=null) {
  ctx.save();
  kotakBulat(x,y,w,h,r);
  ctx.fillStyle = `rgba(8,10,18,${alpha})`;
  ctx.fill();
  if (tepi) { ctx.strokeStyle = tepi; ctx.lineWidth = 1.6; ctx.stroke(); }
  ctx.restore();
}

function sudutHud(x,y,w,h,warna,pj,tebal=3,alpha=1) {
  ctx.save();
  ctx.globalAlpha = alpha; ctx.strokeStyle = warna; ctx.lineWidth = tebal;
  ctx.lineCap = "round";
  [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].forEach(([px,py,dx,dy])=>{
    ctx.beginPath();
    ctx.moveTo(px+dx*pj,py); ctx.lineTo(px,py); ctx.lineTo(px,py+dy*pj);
    ctx.stroke();
  });
  ctx.restore();
}

function tulis(txt,x,y,ukuran,warna,{tebal="800",rata="left",alpha=1,
    spasi=0,bayang=true,garis=0}={}) {
  if (alpha<=.01||!txt) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `${tebal} ${ukuran}px -apple-system,"Segoe UI",Roboto,sans-serif`;
  ctx.textAlign = spasi ? "left" : rata;
  ctx.textBaseline = "middle";
  let mulaiX = x;
  if (spasi) {
    const lbr = [...txt].reduce((s,c)=>s+ctx.measureText(c).width+spasi,0)-spasi;
    if (rata==="center") mulaiX = x-lbr/2;
    else if (rata==="right") mulaiX = x-lbr;
  }
  if (bayang) { ctx.shadowColor="rgba(0,0,0,.75)"; ctx.shadowBlur=7; ctx.shadowOffsetY=2; }
  const gambarSatu = (c,cx)=>{
    if (garis) {
      ctx.lineWidth = garis; ctx.strokeStyle = "rgba(14,10,20,.92)";
      ctx.lineJoin = "round"; ctx.strokeText(c,cx,y);
    }
    ctx.fillStyle = warna; ctx.fillText(c,cx,y);
  };
  if (spasi) {
    let cx = mulaiX;
    for (const c of txt) { gambarSatu(c,cx); cx += ctx.measureText(c).width+spasi; }
  } else gambarSatu(txt,x);
  ctx.restore();
}

// =====================================================================
//  Portal
// =====================================================================
function bentukPortal(tangan, w, h) {
  if (!tangan || tangan.length < 2) return null;
  const t = tangan.map(lm => ({
    idx:   { x: lm[8].x*w, y: lm[8].y*h },
    jempol:{ x: lm[4].x*w, y: lm[4].y*h },
  }));
  let p = [t[0].idx, t[0].jempol, t[1].jempol, t[1].idx];
  const cx = p.reduce((s,q)=>s+q.x,0)/4, cy = p.reduce((s,q)=>s+q.y,0)/4;
  p.sort((a,b)=>Math.atan2(a.y-cy,a.x-cx)-Math.atan2(b.y-cy,b.x-cx));
  // tolak kalau terlalu kecil
  let luas = 0;
  for (let i=0;i<4;i++) { const j=(i+1)%4; luas += p[i].x*p[j].y - p[j].x*p[i].y; }
  if (Math.abs(luas/2) < w*h*0.006) return null;
  return p;
}

function jarakTangan(tangan) {
  if (!tangan || tangan.length<2) return null;
  const a = tangan[0], b = tangan[1];
  const d = Math.hypot(a[0].x-b[0].x, a[0].y-b[0].y);
  const s = (Math.hypot(a[0].x-a[9].x,a[0].y-a[9].y)
           + Math.hypot(b[0].x-b[9].x,b[0].y-b[9].y))/2;
  return d/Math.max(1e-6,s);
}

function gambarPortal(quad, fn, w, h, vis) {
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  quad.forEach(p=>{ minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);
                    maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y); });
  const bx=Math.max(0,Math.floor(minX)), by=Math.max(0,Math.floor(minY));
  const bw=Math.min(w-bx,Math.ceil(maxX-minX)), bh=Math.min(h-by,Math.ceil(maxY-minY));
  if (bw<8||bh<8) return;

  // Filter per-piksel mahal di HP. Kerjakan di versi kecil lalu perbesar --
  // hasilnya tetap bagus karena filter ini memang bergaya kasar/raster.
  const MAKS = mutuFilter;
  const sk = Math.min(1, MAKS/Math.max(bw,bh));
  const kw = Math.max(8, Math.round(bw*sk)), kh = Math.max(8, Math.round(bh*sk));

  kBantu.width=kw; kBantu.height=kh;
  cBantu.imageSmoothingEnabled = true;
  cBantu.drawImage(kanvas, bx,by,bw,bh, 0,0,kw,kh);
  let d = cBantu.getImageData(0,0,kw,kh);
  d = fn(d,kw,kh);
  cBantu.putImageData(d,0,0);

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(quad[0].x,quad[0].y);
  for (let i=1;i<4;i++) ctx.lineTo(quad[i].x,quad[i].y);
  ctx.closePath();
  ctx.clip();
  ctx.globalAlpha = vis;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(kBantu, 0,0,kw,kh, bx,by,bw,bh);
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = vis;
  ctx.strokeStyle = W().utama; ctx.lineWidth = 3.5; ctx.lineJoin="round";
  ctx.shadowColor = W().utama; ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.moveTo(quad[0].x,quad[0].y);
  for (let i=1;i<4;i++) ctx.lineTo(quad[i].x,quad[i].y);
  ctx.closePath(); ctx.stroke();
  ctx.shadowBlur = 0;
  quad.forEach(p=>{
    ctx.beginPath(); ctx.arc(p.x,p.y,5.5,0,7); ctx.fillStyle=W().terang; ctx.fill();
  });
  ctx.restore();
}

// =====================================================================
//  BABAK 1 - HUD
// =====================================================================
function babakHud(t,T,w,h) {
  const C = W();
  ctx.save(); ctx.fillStyle="rgba(4,8,16,.20)"; ctx.fillRect(0,0,w,h); ctx.restore();

  // grid bergerak
  ctx.save(); ctx.globalAlpha=.13; ctx.strokeStyle=C.utama; ctx.lineWidth=1;
  const s=Math.round(w/7), off=(t*24)%s;
  for(let x=-s+off;x<w+s;x+=s){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
  for(let y=-s+off;y<h+s;y+=s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
  ctx.restore();

  // garis scan
  const sy = ((t*0.5)%1)*h;
  const gr = ctx.createLinearGradient(0,sy-h*0.1,0,sy);
  gr.addColorStop(0,"rgba(40,224,255,0)"); gr.addColorStop(1,"rgba(40,224,255,.20)");
  ctx.fillStyle=gr; ctx.fillRect(0,sy-h*0.1,w,h*0.1);
  ctx.save(); ctx.globalAlpha=.85; ctx.strokeStyle=C.utama; ctx.lineWidth=2;
  ctx.shadowColor=C.utama; ctx.shadowBlur=12;
  ctx.beginPath(); ctx.moveTo(0,sy); ctx.lineTo(w,sy); ctx.stroke(); ctx.restore();

  // kotak wajah
  if (wajahBox) {
    const pad = wajahBox.width*0.17;
    const fx = wajahBox.originX-pad, fy = wajahBox.originY-pad;
    const fw = wajahBox.width+pad*2, fh = wajahBox.height+pad*2;
    const a = easeOut(Math.min(1,(t-0.3)/0.7));
    if (a>0) {
      sudutHud(fx,fy,fw,fh,C.utama,fw*0.26,3,a*0.95);
      if (t>0.9) tulis(ketik("SUBJECT LOCKED",t,0.9,0.5), fx, fy-14,
                       Math.max(11,w*0.031), C.utama, {tebal:"700",alpha:a,spasi:1.2});
    }
  }

  // panel data
  if (t>1.2) {
    const a = easeOut(Math.min(1,(t-1.2)/0.55));
    const pw = w*0.84, px = w*0.08, ph = h*0.175, py = h*0.63;
    panelKaca(px,py,pw,ph*a,0.62,16,`rgba(40,224,255,${0.45*a})`);
    if (a>0.7) {
      const dalam = pw-32;
      tulis(ketik("// IDENTITAS",t,1.7,.4), px+16, py+ph*0.17,
            Math.max(10,w*0.028), C.aksen, {tebal:"700",alpha:a,spasi:1.4});
      const uN = muatFont(D.nama, w*0.075, dalam);
      tulis(ketik(D.nama,t,2.05,.75), px+16, py+ph*0.45, uN, "#fff", {alpha:a});
      const sub = `${D.prodi} · ${D.angkatan}`;
      const uS = muatFont(sub, w*0.036, dalam, "600");
      tulis(ketik(sub,t,2.9,.7), px+16, py+ph*0.76, uS, C.terang, {tebal:"600",alpha:a});
    }
  }

  // bar progres
  if (t>3.5) {
    const nilai = Math.min(1,Math.max(0,(t-3.7)/Math.max(.1,T-5.2)));
    const bx=w*0.08, bw=w*0.84, by=h*0.845, bh=8;
    panelKaca(bx,by,bw,bh,.4,bh/2);
    ctx.save(); ctx.fillStyle=C.utama; ctx.shadowColor=C.utama; ctx.shadowBlur=10;
    kotakBulat(bx,by,bw*nilai,bh,bh/2); ctx.fill(); ctx.restore();
    const selesai = nilai>=.99;
    const wr = selesai ? "#5aff8f" : C.utama;
    tulis(selesai?"VERIFIED":"SCANNING…", bx, by-13, Math.max(10,w*0.028), wr,
          {tebal:"700",spasi:1});
    tulis(`${Math.round(nilai*100)}%`, bx+bw, by-13, Math.max(10,w*0.028), wr,
          {tebal:"700",rata:"right"});
  }

  // stempel
  if (t>T-1.5) {
    const a = easeOut(Math.min(1,(t-(T-1.5))/0.45));
    const kedip = 0.6+0.4*Math.sin(t*12);
    tulis("IDENTITY VERIFIED", w/2, h*0.11, Math.max(15,w*0.045), "#5aff8f",
          {rata:"center",alpha:a*kedip,spasi:2.2});
  }

  sudutHud(16,16,w-32,h-32,C.utama,w*0.11,2,.42);
  tulis("REC ●", 26, 30, Math.max(9,w*0.026), "#ff4d4d",
        {tebal:"700",alpha:.55+.45*Math.sin(t*5)});
  tulis(`T+${t.toFixed(1)}s`, w-26, 30, Math.max(9,w*0.026), C.terang,
        {tebal:"600",rata:"right",alpha:.62});
}

// =====================================================================
//  BABAK 2 - PORTAL
// =====================================================================
function babakPortal(t,T,w,h,tangan) {
  const C = W();
  const quadBaru = bentukPortal(tangan,w,h);

  if (quadBaru) {
    quadHalus = quadHalus
      ? quadHalus.map((p,i)=>({ x:p.x*0.62+quadBaru[i].x*0.38,
                                y:p.y*0.62+quadBaru[i].y*0.38 }))
      : quadBaru;
    portalVis = Math.min(1, portalVis+0.11);
  } else {
    portalVis = Math.max(0, portalVis-0.08);
  }

  // gesture ganti filter
  const d = jarakTangan(tangan);
  if (d !== null) {
    if (siapGanti && d < 2.4) {
      idxFilter = (idxFilter+1)%FILTER.length; siapGanti=false; kilat=1;
    } else if (!siapGanti && d > 3.4) siapGanti = true;
  }

  const [namaF, fnF] = FILTER[idxFilter];

  if (quadHalus && portalVis>0.02) {
    gambarPortal(quadHalus, fnF, w, h, portalVis);

    const cx = quadHalus.reduce((s,p)=>s+p.x,0)/4;
    const cy = quadHalus.reduce((s,p)=>s+p.y,0)/4;
    const lebar = Math.min(
      Math.hypot(quadHalus[1].x-quadHalus[0].x, quadHalus[1].y-quadHalus[0].y),
      Math.hypot(quadHalus[2].x-quadHalus[3].x, quadHalus[2].y-quadHalus[3].y));

    // kata bergantian
    if (D.kata.length) {
      const n = D.kata.length, slot = T/n;
      const i = Math.min(n-1, Math.floor(t/slot));
      const tl = (t-i*slot)/slot;
      const a = amplop(tl,.22,.8)*portalVis;
      if (a>0.02) {
        const kata = D.kata[i];
        const u = muatFont(kata, Math.min(lebar*0.2, w*0.09), lebar*0.82);
        const naik = (1-easeOut(Math.min(1,tl/0.22)))*18;
        tulis(kata, cx, cy+naik, u, "#fff",
              {rata:"center",alpha:a,spasi:Math.max(1,u/14),garis:3});
        ctx.save(); ctx.globalAlpha=a*0.9; ctx.strokeStyle=C.utama; ctx.lineWidth=3;
        ctx.beginPath();
        ctx.moveTo(cx-lebar*0.17, cy+naik+u*0.72);
        ctx.lineTo(cx+lebar*0.17, cy+naik+u*0.72);
        ctx.stroke(); ctx.restore();
      }
    }

    // label filter
    const atas = Math.min(...quadHalus.map(p=>p.y));
    tulis(`[ ${namaF} ]`, cx, atas-16, Math.max(10,w*0.03), C.utama,
          {tebal:"700",rata:"center",alpha:.92*portalVis,spasi:1.4});

    // indikator titik
    const bawah = Math.max(...quadHalus.map(p=>p.y));
    const gap = w*0.032, x0 = cx-(FILTER.length-1)*gap/2;
    ctx.save(); ctx.globalAlpha = portalVis*0.9;
    FILTER.forEach((_,i)=>{
      ctx.beginPath();
      ctx.arc(x0+i*gap, bawah+22, i===idxFilter?4.5:2.5, 0, 7);
      ctx.fillStyle = i===idxFilter ? C.utama : "rgba(255,255,255,.42)";
      ctx.fill();
    });
    ctx.restore();
  } else {
    const a = 0.55+0.45*Math.sin(t*3);
    tulis("ANGKAT DUA TANGAN", w/2, h*0.48, Math.max(15,w*0.048), C.terang,
          {rata:"center",alpha:.9,spasi:1.6});
    tulis("buka telunjuk + jempol", w/2, h*0.48+w*0.062,
          Math.max(11,w*0.031), C.utama, {tebal:"600",rata:"center",alpha:a});
  }

  // kilat saat ganti
  if (kilat>0.01) {
    ctx.save(); ctx.globalAlpha=kilat*0.22; ctx.fillStyle="#fff";
    ctx.fillRect(0,0,w,h); ctx.restore();
    kilat = Math.max(0, kilat-0.12);
  }

  tulis("rapatkan tangan → ganti filter", w/2, h-h*0.055,
        Math.max(10,w*0.029), C.terang, {tebal:"600",rata:"center",alpha:.68});
}

// =====================================================================
//  BABAK 3 - POP ART
// =====================================================================
function babakPop(t,T,w,h) {
  const C = W();

  // sinar radial
  ctx.save();
  ctx.globalAlpha = .12; ctx.fillStyle = C.aksen;
  const cx=w/2, cy=h*0.3, R=Math.hypot(w,h), n=24, rot=t*0.2;
  for (let i=0;i<n;i+=2) {
    const a1=rot+i*2*Math.PI/n, a2=rot+(i+1)*2*Math.PI/n;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.lineTo(cx+R*Math.cos(a1),cy+R*Math.sin(a1));
    ctx.lineTo(cx+R*Math.cos(a2),cy+R*Math.sin(a2));
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // gradasi supaya teks terbaca
  let g = ctx.createLinearGradient(0,h*0.55,0,h);
  g.addColorStop(0,"rgba(6,6,14,0)"); g.addColorStop(1,"rgba(6,6,14,.88)");
  ctx.fillStyle=g; ctx.fillRect(0,h*0.55,w,h*0.45);
  g = ctx.createLinearGradient(0,0,0,h*0.22);
  g.addColorStop(0,"rgba(6,6,14,.7)"); g.addColorStop(1,"rgba(6,6,14,0)");
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h*0.22);

  // nama besar
  const a = easeOut(Math.min(1,t/0.7));
  const yN = h*0.78 + (1-a)*70;
  const uN = muatFont(D.nama, w*0.108, w*0.88);
  tulis(D.nama, w/2, yN, uN, "#fff", {rata:"center",alpha:a,spasi:2,garis:5});

  if (t>0.5) {
    const b = easeOut(Math.min(1,(t-0.5)/0.5));
    ctx.save(); ctx.globalAlpha=b; ctx.strokeStyle=C.utama; ctx.lineWidth=3.5;
    ctx.shadowColor=C.utama; ctx.shadowBlur=10;
    ctx.beginPath();
    ctx.moveTo(w/2-w*0.22*b, yN+uN*0.72); ctx.lineTo(w/2+w*0.22*b, yN+uN*0.72);
    ctx.stroke(); ctx.restore();

    const sub = D.prodi.toUpperCase();
    const uS = muatFont(sub, w*0.04, w*0.86, "700");
    tulis(sub, w/2, yN+uN*1.12, uS, "#fff", {tebal:"700",rata:"center",alpha:b,spasi:2});
    if (D.kampus) {
      const uK = muatFont(D.kampus, w*0.029, w*0.86, "600");
      tulis(D.kampus, w/2, yN+uN*1.12+w*0.055, uK, C.terang,
            {tebal:"600",rata:"center",alpha:b*0.9});
    }
  }

  if (t>1.0) {
    const c = easeOut(Math.min(1,(t-1.0)/0.5));
    const sk = 1+0.03*Math.sin(t*2.4);
    const uP = muatFont(D.penutup, w*0.07*sk, w*0.84);
    tulis(D.penutup, w/2, h*0.115, uP, C.utama,
          {rata:"center",alpha:c,spasi:3,garis:4});
  }

  if (t>T-0.6) {
    ctx.save();
    ctx.globalAlpha = Math.min(1,(t-(T-0.6))/0.6);
    ctx.fillStyle="#000"; ctx.fillRect(0,0,w,h); ctx.restore();
  }
}

// =====================================================================
//  Loop utama
// =====================================================================
function gambar() {
  if (!jalan) return;
  requestAnimationFrame(gambar);
  if (vid.readyState < 2) return;

  const w = kanvas.width, h = kanvas.height;
  const sekarang = performance.now();

  // gambar video (cover + mirror kalau kamera depan)
  const vr = vid.videoWidth/vid.videoHeight, kr = w/h;
  let sx,sy,sw,sh;
  if (vr > kr) { sh=vid.videoHeight; sw=sh*kr; sx=(vid.videoWidth-sw)/2; sy=0; }
  else { sw=vid.videoWidth; sh=sw/kr; sx=0; sy=(vid.videoHeight-sh)*0.32; }
  ctx.save();
  if (depan) { ctx.translate(w,0); ctx.scale(-1,1); }
  ctx.drawImage(vid,sx,sy,sw,sh,0,0,w,h);
  ctx.restore();

  const t = (sekarang - tMulai)/1000;
  const T = DUR[babak];
  const tl = t % T;

  // deteksi sesuai babak (dibatasi agar tidak membebani HP)
  const perluDeteksi = sekarang - tDeteksiLalu > jedaDeteksi;
  if (perluDeteksi) tDeteksiLalu = sekarang;
  const tDet0 = perluDeteksi ? performance.now() : 0;
  let tangan = tanganTerakhir;
  try {
    if (babak===1 && handLm && perluDeteksi) {
      const r = handLm.detectForVideo(vid, sekarang);
      tangan = (r.landmarks && r.landmarks.length)
        ? r.landmarks.map(lm => depan ? lm.map(p=>({x:1-p.x,y:p.y,z:p.z})) : lm)
        : [];
      tanganTerakhir = tangan;
    } else if (babak===0 && faceDet && perluDeteksi) {
      const r = faceDet.detectForVideo(vid, sekarang);
      if (r.detections && r.detections.length) {
        const d = r.detections.reduce((a,b)=>
          (a.boundingBox.width*a.boundingBox.height >
           b.boundingBox.width*b.boundingBox.height)?a:b);
        const b = d.boundingBox;
        const sx2 = w/vid.videoWidth, sy2 = h/vid.videoHeight;
        // sesuaikan ke kanvas + mirror
        const bw = b.width*sx2, bh = b.height*sy2;
        let bx = b.originX*sx2, by = b.originY*sy2;
        if (depan) bx = w - bx - bw;
        wajahBox = { originX:bx, originY:by, width:bw, height:bh };
      }
    }
  } catch(e) {}

  // --- sesuaikan beban otomatis sesuai kemampuan HP
  if (perluDeteksi && tDet0) {
    const d = performance.now() - tDet0;
    msDeteksi = msDeteksi ? msDeteksi*0.85 + d*0.15 : d;
    if (msDeteksi > 90)      { jedaDeteksi = 150; mutuFilter = 130; }
    else if (msDeteksi > 45) { jedaDeteksi = 90;  mutuFilter = 160; }
    else                     { jedaDeteksi = 45;  mutuFilter = 200; }
  }

  if (babak===0) babakHud(tl,T,w,h);
  else if (babak===1) babakPortal(tl,T,w,h,tangan);
  else babakPop(tl,T,w,h);

  // fps
  if (tLalu) {
    const f = 1000/Math.max(1,sekarang-tLalu);
    fpsHal = fpsHal ? fpsHal*0.9+f*0.1 : f;
    elFps.textContent = `${fpsHal.toFixed(0)} fps`;
  }
  tLalu = sekarang;
}

async function siapkanModel() {
  elMuatT.textContent = "Memuat model AI…";
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm");
  handLm = await HandLandmarker.createFromOptions(vision, {
    baseOptions:{ modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate:"GPU" },
    runningMode:"VIDEO", numHands:2,
    minHandDetectionConfidence:.4, minHandPresenceConfidence:.4,
    minTrackingConfidence:.4,
  });
  elMuatT.textContent = "Memuat pendeteksi wajah…";
  faceDet = await FaceDetector.createFromOptions(vision, {
    baseOptions:{ modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
      delegate:"GPU" },
    runningMode:"VIDEO", minDetectionConfidence:.4,
  });
}

async function nyalakanKamera() {
  const s = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode: depan?"user":"environment",
            width:{ideal:1280}, height:{ideal:720} },
    audio:false });
  if (vid.srcObject) vid.srcObject.getTracks().forEach(t=>t.stop());
  vid.srcObject = s;
  await vid.play();
  const skala = Math.min(1, 720/Math.max(1,vid.videoHeight));
  kanvas.width  = Math.round(608);
  kanvas.height = Math.round(1080);
}

async function mulai() {
  elGalat.style.display = "none";
  if (!navigator.mediaDevices?.getUserMedia) {
    return galat("Browser ini tidak mendukung kamera. Pakai Safari (iPhone) atau Chrome (Android).");
  }
  if (!window.isSecureContext) {
    return galat("Halaman harus dibuka lewat HTTPS agar kamera bisa dipakai. "
      + "Kalau ini dibuka dari file di HP, unggah dulu ke GitHub Pages (lihat panduan).");
  }
  if (dalamFrame && !izinFrame) {
    return galat("Kamera diblokir karena halaman tampil di dalam bingkai. "
      + "Tekan tombol kuning \"Buka di Tab Baru\" di atas dulu.");
  }
  elMulai.style.display = "none";
  elMuat.style.display  = "flex";
  try {
    await nyalakanKamera();
    await siapkanModel();
    elMuat.style.display = "none";
    elKtrl.style.display = "block";
    elStat.style.display = "flex";
    jalan = true; tMulai = performance.now();
    perbaruiTombol();
    gambar();
  } catch(e) {
    elMuat.style.display = "none";
    elMulai.style.display = "flex";
    let p = e.message||String(e);
    if (e.name==="NotAllowedError") {
      p = (dalamFrame && !izinFrame)
        ? "Kamera diblokir karena halaman ini tampil di dalam bingkai. Tekan tombol kuning \"Buka di Tab Baru\" di atas."
        : "Izin kamera ditolak. Buka pengaturan situs, izinkan kamera, lalu muat ulang.";
    }
    else if (e.name==="NotFoundError") p = "Kamera tidak ditemukan.";
    galat(p);
  }
}

function galat(p) {
  elGalat.textContent = p;
  elGalat.style.display = "block";
}

    try {
      const st = kanvas.captureStream(30);
      const pilihan = ["video/mp4;codecs=avc1","video/webm;codecs=vp9","video/webm"];
      const mime = pilihan.find(m=>MediaRecorder.isTypeSupported(m)) || "";
      rec = new MediaRecorder(st, mime?{mimeType:mime,videoBitsPerSecond:6e6}:{});
      potongan = [];
      rec.ondataavailable = e=>{ if(e.data.size) potongan.push(e.data); };
      rec.onstop = ()=>{
        const blob = new Blob(potongan,{type:rec.mimeType||"video/webm"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `perkenalan_${Date.now()}.${(rec.mimeType||"").includes("mp4")?"mp4":"webm"}`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url), 4000);
      };
      rec.start();
      sedangRekam = true;
      btnRekam.textContent = "■ Stop";
      btnRekam.classList.remove("rekam");
      btnRekam.classList.add("aktif");
    } catch(e) { galat("Perekaman tidak didukung browser ini."); }
  } else {
    rec.stop(); sedangRekam=false;
    btnRekam.textContent="● Rekam";
    btnRekam.classList.add("rekam"); btnRekam.classList.remove("aktif");
  }
};

// ---------- pengaturan ----------
const bukaAtur = ()=>{
  document.getElementById("iNama").value = D.nama;
  document.getElementById("iProdi").value = D.prodi;
  document.getElementById("iAngkatan").value = D.angkatan;
  document.getElementById("iKampus").value = D.kampus;
  document.getElementById("iKata").value = D.kata.join(", ");
  document.getElementById("iPenutup").value = D.penutup;
  elAtur.style.display = "flex";
};
document.getElementById("btnAtur").onclick = bukaAtur;
document.getElementById("btnAtur2").onclick = bukaAtur;

const wrapWarna = document.getElementById("pilihWarna");
Object.entries(TEMA).forEach(([k,v])=>{
  const b = document.createElement("div");
  b.className = "wbulat"+(k===D.tema?" pilih":"");
  b.style.background = v.utama;
  b.onclick = ()=>{ D.tema=k;
    wrapWarna.querySelectorAll(".wbulat").forEach(x=>x.classList.remove("pilih"));
    b.classList.add("pilih"); };
  wrapWarna.appendChild(b);
});

document.getElementById("tutupAtur").onclick = ()=>{
  D.nama = (document.getElementById("iNama").value||bawaan.nama).toUpperCase();
  D.prodi = document.getElementById("iProdi").value||bawaan.prodi;
  D.angkatan = document.getElementById("iAngkatan").value||bawaan.angkatan;
  D.kampus = document.getElementById("iKampus").value;
  D.kata = (document.getElementById("iKata").value||"")
    .split(",").map(s=>s.trim().toUpperCase()).filter(Boolean).slice(0,3);
  if (!D.kata.length) D.kata = bawaan.kata;
  D.penutup = (document.getElementById("iPenutup").value||bawaan.penutup).toUpperCase();
  simpan();
  elAtur.style.display = "none";
};

// jaga layar tetap menyala
if ("wakeLock" in navigator) {
  document.addEventListener("click", async ()=>{
    try { await navigator.wakeLock.request("screen"); } catch(e){}
  }, { once:true });
}

</script>
